[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-read-agent"
version = "0.1.0"
description = "A grounded academic paper reading agent"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1,<2",
  "docling>=2.121,<3",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<2",
  "opencv-python>=4.10,<5",
  "pymupdf>=1.27,<2",
  "rapidocr>=3.9,<4",
  "python-multipart>=0.0.20,<1",
  "transformers>=5.8,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_glm: opt-in network test against the configured GLM service",
  "performance: local performance smoke baseline",
]
